name: Verify Build (测试包)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（默认 1.0.0）'
        required: false
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build normal flavor (release)
        run: ./gradlew assembleNormalRelease -P "version=${{ inputs.version }}"

      # 配置了签名 secret 时用与正式发布相同的密钥签名；未配置则保留未签名产物（仅供编译验证，无法安装）
      - name: Sign release APKs (if signing secrets configured)
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_SIGNING_KEY:-}" ]; then
            echo "::warning::未配置签名密钥，输出未签名包（仅供编译验证，无法安装）"
            exit 0
          fi
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BT_DIR=$(ls -d "$SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BT_DIR"
          echo "${ANDROID_SIGNING_KEY}" | base64 -d > "$RUNNER_TEMP/sesame-m-release.jks"
          # 签名 normal/release 目录下的全部 ABI 拆分 APK（universal + arm64-v8a + armeabi-v7a）
          for APK_FILE in app/build/outputs/apk/normal/release/*.apk; do
            [ -e "$APK_FILE" ] || { echo "No APK found in app/build/outputs/apk/normal/release"; exit 1; }
            echo "Signing $(basename "$APK_FILE")"
            "$BT_DIR/zipalign" -f 4 "$APK_FILE" "$RUNNER_TEMP/aligned.apk"
            "$BT_DIR/apksigner" sign \
              --ks "$RUNNER_TEMP/sesame-m-release.jks" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
              --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
              --out "$APK_FILE" \
              "$RUNNER_TEMP/aligned.apk"
          done

      - name: List APK outputs
        run: |
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      # 上传产物，便于直接下载安装做测试
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: sesame-m-test-apks
          path: app/build/outputs/apk/normal/release/*.apk
          if-no-files-found: error
